# v0.1
# SniffWorks CI
#
# Runs the i2c_tools suites through its single runner (i2c_tools/conftest.py,
# R9): the 20 script suites in tests/, the 5 loopback DUT suites, and the two
# C host-test folders (firmware decoder/framing/edge ring; DUT proto/regmap/
# timing), each judged by exit code. Exit 77 is a loud skip; suites listed in
# conftest.py EXPECTED_FAIL must fail (strict), so a fixed one turns CI red
# until its entry is removed.
#
# Python 3.12 with the pins in i2c_tools/ci-constraints.txt mirrors the
# shared venv ($SHARED_VENV, root CLAUDE.md). Ubuntu has no libEGL.so.1 by
# default, so the Qt system libraries are installed first; all jobs run Qt
# offscreen. macOS mirrors the owner's machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i2c_tools:
    name: "i2c_tools / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: i2c_tools/ci-constraints.txt

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies (pinned)
        working-directory: i2c_tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c ci-constraints.txt

      - name: Run every suite (python -m pytest)
        working-directory: i2c_tools
        run: python -m pytest
