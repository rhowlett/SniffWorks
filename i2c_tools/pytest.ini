# [v0.1]
# pytest is only the runner here: conftest.py collects each script suite and
# each C host-test folder as one item and judges it by exit code (R9).
[pytest]
testpaths = tests loopback_dut/tests embedded/tests/host loopback_dut/tests/host
python_files = test_*.py smoke_test.py
addopts = -rsxX -p no:cacheprovider
